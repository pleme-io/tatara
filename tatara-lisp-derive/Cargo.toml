[package]
name = "tatara-lisp-derive"
description = "#[derive(TataraDomain)] — auto-generate a Lisp compiler from a Rust struct's fields"
version = "0.3.27"
edition.workspace = true
authors.workspace = true
license.workspace = true
# Phase 0 freeze (theory/TATARA-LISP-CONSOLIDATION.md): this crate owns
# crates.io tatara-lisp-derive at 0.2.154 while the lib is published from
# pleme-io/tatara-lisp at 0.2.5. Two repos, two halves of one pair, one
# namespace. Reversible; preferred over a yank (86 published versions,
# none yanked, external reverse-deps unenumerable).
publish = false

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
