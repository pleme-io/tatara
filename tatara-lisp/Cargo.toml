[package]
name = "tatara-lisp"
description = "Homoiconic S-expression reader + macroexpander → ProcessSpec — Lisp surface for tatara Processes"
version = "0.3.27"
edition.workspace = true
authors.workspace = true
license.workspace = true
# Phase 0 freeze, other half (theory/TATARA-LISP-CONSOLIDATION.md). The
# sibling ../tatara-lisp-derive/Cargo.toml was frozen for exactly this
# reason and this crate was missed, so the seal read as applied while the
# larger half of the pair stayed publishable. Both halves of the name
# collision are now frozen.
#
# pleme-io/tatara-lisp is the canonical publisher and reached crates.io
# 0.3.3 on 2026-07-30 (all 17 members). This workspace is still at
# 0.2.154, so publishing from here would push 0.2.x over the canonical
# namespace and win for every consumer still on a caret "0.2" spec — of
# which there are several in the fleet mid-migration. Reversible; preferred
# over a yank.
publish = false

[dependencies]
tatara-lisp-derive = { path = "../tatara-lisp-derive" , version = "0.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Expansion-cache key hashing: BLAKE3 over canonical serde_json of args.
blake3 = "1"

# Feature-gated interop with iac-forge's canonical SExpr (for BLAKE3
# attestation + render cache reuse). Turn on with `--features iac-forge`.
iac-forge = { version = "0.1", optional = true }

[dev-dependencies]
# Byte-shape parity pin for the `hash::hex_blake3_of_json` substrate
# — asserts blake3's own `Hash::to_hex().to_string()` spelling is
# byte-identical to the pre-lift `hex::encode(blake3::hash(_)
# .as_bytes())` chain every downstream identity slot walked. Production
# code in this crate does NOT reach for `hex`; the composer uses
# `blake3::Hash::to_hex` directly, so `hex` stays a dev-only
# regression-guard for the parity assertion.
hex = "0.4"

[features]
default = []
iac-forge = ["dep:iac-forge"]

# NOTE: tatara-lispc binary moved to tatara-process (it's ProcessSpec-specific).
