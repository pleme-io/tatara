[package]
name        = "tatara-wasm"
description = "Multi-runtime WASI/WASM host for tatara — one crate, feature-gated runtimes (wasmtime, WasmEdge, Wasmer, wasmi, WAMR). Phase H.3 + H.4."
version     .workspace = true
edition     .workspace = true
authors     .workspace = true
license     .workspace = true

[lib]
name = "tatara_wasm"
path = "src/lib.rs"

[features]
# Default: the reference WASI Preview 2 implementation.
default = ["runtime-wasmtime"]

# Runtime backends — each pluggable, each can coexist at consumer choice.
runtime-wasmtime = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:anyhow", "dep:hyper"]
runtime-wasmer   = ["dep:wasmer"]
runtime-wasmi    = ["dep:wasmi"]
runtime-wamr     = []       # H.4 follow-up — needs C build harness.
runtime-wasmedge = []       # H.4 follow-up — needs C++ SDK.

# "All Rust-native" — convenient feature for the CI smoke matrix.
all-rust-runtimes = ["runtime-wasmtime", "runtime-wasmer", "runtime-wasmi"]

# Optional WASI feature gates — runtime support varies.
fixtures   = []
wasi-nn    = []   # Neural network interface.
wasi-http  = ["runtime-wasmtime", "dep:wasmtime-wasi-http", "dep:http-body-util"]
wasi-clocks = []  # Clocks (baseline p2 — enabled by default per runtime).
wasi-sockets = [] # Raw socket imports.

[dependencies]
wasmtime      = { version = "36", optional = true, default-features = false, features = ["runtime", "cranelift", "component-model", "async", "std", "wat", "parallel-compilation", "addr2line"] }
wasmtime-wasi = { version = "36", optional = true }
wasmtime-wasi-http = { version = "36", optional = true }
anyhow        = { version = "1", optional = true }
hyper         = { version = "1", optional = true, features = ["server", "http1"] }
http-body-util = { version = "0.1", optional = true }
wasmer        = { version = "6.1", optional = true, default-features = false, features = ["cranelift", "sys"] }
wasmi         = { version = "0.40", optional = true }
wat           = "1"

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "1"
tokio      = { version = "1", features = ["sync", "rt", "time", "macros", "net"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "time", "macros", "net", "io-util"] }
